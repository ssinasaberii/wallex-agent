# Wallex spot agent — default configuration (spec 09 v1.2 + ADR-026/027/028).
# Every strategy number here is Experimental (09 §0.6). Values not verified against the live
# account carry `assumed: true` (09 §0.4). Secrets never go in this file; they live in .env.
#
# v1.3 (team decision 2026-10-22, ADR-028): daily regime + 4h trigger, 3xATR trailing stop, holds up to
# 7 days, fee gate off. Chosen by scripts/optimize_tf.py on the 3-year snapshot ecbb7bb14b3ec827
# (Train search, Validation selection, one Test run; reports/experiments/tf_stage*.csv).
# The previous hourly configuration is kept in config/v1.2_hourly.yaml.
#
# v1.4 (team decision 2026-10-23, ADR-030): exits from scripts/exp_exits.py (Train search, Validation selection,
# one Test run): T1 target 3R, initial stop 3 x ATR, trailing stop 4 x ATR. News gate on (ADR-029).
#
# v1.4.1 (user decision 2026-10-23, ADR-032): risk per trade 0.5 % (was 0.25), total open risk 2 % (was 1).
# From scripts/exp_capital.py; everything else unchanged.

strategy_version: v1.4.1-1D4h-trend-exits-risk0.5

challenge:
  # Team, 2026-10-23: extended to the end of Monday 5 Aban 1405, 24:00 Tehran = 2026-10-26 20:30 UTC (Q-39;
  # was Friday 21:00 Tehran). .env CHALLENGE_END_UTC overrides if set (Q-15).
  end_utc: "2026-10-26T20:30:00Z"
  initial_equity_tmn: 5000000
  settlement:
    stop_entries_min: 90              # 05 §14
    start_selling_min: 60
    final_check_min: 15

data:
  base_url: https://api.wallex.ir
  trigger_resolution: "60"            # only 60 and 1D are real resolutions (api-verification V2)
  regime_hours: 24                    # daily regime bars, built from 1h on UTC day boundaries (v1.3)
  trigger_hours: 4                    # 4h trigger bars, UTC boundaries 00/04/.../20 (v1.3)
  udf_chunk_bars: 500                 # API caps a response at ~695 bars
  history_days: 400                   # the daily regime needs 360 closed daily bars of warm-up
  min_regime_bars: 360                # warm-up = max(150, 360) closed regime bars (09 §6)
  min_trigger_bars: 60
  quote_asset: TMN
  btc_regime_symbol: BTCUSDT          # ADR-022
  btc_tmn_symbol: BTCTMN              # RS vs BTC, macro spread check
  usdt_tmn_symbol: USDTTMN            # USDT-denominated returns in reports
  fetch_top_n: 45                     # history fetched for the top-N eligible pairs by today's volume
  # Team decision 2026-10-22 (Q-33): signals are computed on dollar-adjusted prices (TMN price divided by
  # the USDT/TMN close of the same hour) to remove the dollar's noise; orders, stops, targets and P&L stay
  # in TMN on TMN pairs. "tmn" restores the original behaviour.
  signal_price: usdt_adjusted         # usdt_adjusted | tmn

universe:
  top_n_by_volume: 25
  max_spread_pct: 0.30
  exclude_categories: [1, 50]         # hector categories: 1 = stablecoins, 50 = tokenized RWA (Q-24)
  exclude_stablecoins: [USDT, USDC, DAI, TUSD, BUSD, FDUSD, USDE, USDD, USDP, PYUSD]
  exclude_non_crypto: [XAUT, PAXG, USOON, COPXON, SLVON]   # Q-24
  # Q-30: skip pairs with too much missing 1h data. Checked per cycle on the trailing window only
  # (causal; no look-ahead), so a pair can enter later once its data is clean.
  data_quality_window_h: 720          # 30 days
  max_missing_pct: 2.0                # liquid pairs miss ~0.1%; thin pairs 1-7%
  # Static spread estimate for backtest (no historical spread). Median of shadow snapshots when
  # available, else the Phase 0 snapshot. Reported as a limitation (09 §7.1).
  spread_estimate_source: phase0_snapshot

indicators:
  ema_fast: 20
  ema_slow: 50
  ema_slope_lookback: 10
  atr_period: 14
  adx_period: 14
  rsi_period: 14
  bb_period: 20
  bb_std: 2.0
  donchian_period: 20
  relvol_period: 20
  atr_pct_rank_window: 360            # 360 regime bars (one year of daily bars in v1.3)
  ad_slope_bars: 5

btc_filter:
  enabled: true
  high_vol_size_mult: 0.5

regime:
  high_vol_atr_pct_rank: 90
  trend_adx_min: 25
  range_adx_max: 20
  hysteresis_bars: 2
  hysteresis_enabled: true

setups:
  T1_pullback:
    enabled: true
    lookback_bars: 3
    touch_atr_mult: 0.5
    rsi_min: 40
    rsi_max: 50
    target_r: 3.0                     # v1.4 (was 2.0)
    rr_min: 1.6
    h_max: 168                        # hours (v1.3)
  T2_breakout:
    enabled: true
    relvol_min: 1.5
    breakout_ad_confirm: false
    target_r: 2.5
    rr_min: 2.0
    h_max: 168
  T3_meanrev:
    enabled: true                     # Q-13: decided after ablation
    rsi_max: 35
    rr_min: 1.0
    h_max: 168
  gray_zone:
    enabled: true
    size_mult: 0.5
  priority: [T2_breakout, T1_pullback, T3_meanrev]

stops:
  k_atr: 3.0                          # v1.4 (was 2.0): wider stop, smaller position, same 0.25 % risk
  min_stop_pct: 1.5
  max_stop_pct: 8.0                   # 2 x ATR on 4h bars is wider than on 1h (v1.3)

fee_gate:
  # ADR-028 (team decision): off in v1.3. With the gate on, the 1D/4h configuration took no trades in
  # Validation; with it off it was profitable in Train, Validation and Test. Fees still enter position
  # sizing (risk includes the full round-trip cost, Q-08) and every candidate logs its cost estimate.
  enabled: false
  safety_buffer_pct: 0.15
  min_net_edge_pct: 0.25
  c_move: 0.37                        # calibrated on Train for 1D/4h (reports/experiments/tf_calibration.json)
  horizons_h: [8, 12, 24, 48, 96, 168]
  max_cost_to_move: 0.5

fees:
  # Wallex public fee schedule, user level 1 (30-day volume 0-100M TMN), given by the team on
  # 2026-10-22 (Q-31). Not read from /v1/account/fee (V7 still fails), hence source below.
  assumed: false
  source: "team: Wallex fee schedule level 1"
  snapshot_id: wallex-level1-2026-10-22
  maker_pct: 0.25
  taker_pct: 0.30
  sensitivity_per_side_pct: [0.10, 0.20, 0.25, 0.30]

slippage:
  assumed: true
  tier1_top_n: 5
  tier1_per_side_pct: 0.05
  tier2_per_side_pct: 0.15

ranking:
  max_candidates_per_cycle: 3
  w_rs_vs_btc: 0.4
  w_adx: 0.3
  w_relvol: 0.3

risk:
  equity_cap_tmn: 5000000
  risk_per_trade_pct: 0.5            # ADR-032 (was 0.25)
  max_open_risk_pct: 2.0             # ADR-032 (was 1.0)
  max_position_pct: 15.0
  max_slots: 10
  min_buy_tmn: 100000
  max_daily_loss_pct: 1.5
  kill_switch_drawdown_pct: 3.0
  # Team decision 2026-10-23 (ADR-031): the 3 % kill switch re-arms at each UTC day and measures the drawdown from
  # that day's start. Before: never re-armed. One 9.6-month account: -0.73 % (never) vs +3.31 % (daily).
  kill_switch_reset: daily

exits:
  breakeven_at_r: 1.0
  trail_atr_mult: 4.0                 # v1.4 (v1.3: 3.0)
  trail_t1_after_r: 1.0
  time_exit_t3_bars: 168              # hours (name kept for compatibility)
  time_exit_t12_max_bars: 168         # hours: T1/T2 exit after min(2H, this)
  stop_check_seconds: 15
  thesis_exit_orderflow: log_only

order_flow:
  obi_mode: confirm                   # shadow/live only
  tfi_mode: log_only                  # until isBuyOrder is confirmed (V5)
  obi_band_pct: 0.5
  w_obi_frac_of_h: 0.05
  w_obi_min_min: 2
  w_obi_max_min: 15
  w_obi_min_updates: 5
  w_tfi_min_trades: 20
  w_tfi_max_frac_of_h: 0.25
  min_tfi_value_tmn: 20000000
  reject_below: -0.20
  thesis_exit_below: -0.30

news:
  # Team decision 2026-10-22: news is part of the trading algorithm (shadow/live only; no historical feed).
  # The shadow runner keeps A/B without news for comparison; C (and live) use it.
  enabled: true
  poll_seconds: 300
  block_asset_hours: 12               # negative, severity 3, tier <= 2, younger than max_age_hours
  block_all_hours: 6                  # systemic event (EVENT_SHOCK)
  max_age_hours: 6
  max_block_tier: 2
  min_choice_prob: 0.5                # below this an answer is "unclear" (never blocks, Q-18)
  systemic_min_prob: 0.6
  context_hours: 24                   # related headlines given to the judge as context
  max_feed_silence_min: 45            # no successful poll for this long -> no new entries (fail closed)
  fng_url: "https://api.alternative.me/fng/"

macro:
  caution_before_min: 30
  block_before_min: 15
  block_after_min: 30
  spread_recovery_mult: 1.5

judge:
  provider: rules_baseline            # backtest uses only this (09 §7.9)
  timeout_s: 20
  candidate_ttl_s: 600
  baseline_gray_policy: reject
  laya:
    url_env: LAYA_URL
    checkpoint: english
    max_state_tokens: 300
    thresholds:
      insufficient: 0.5
      conflict: 0.5
      news: 0.5
      gray: 0.5
      approve: 0.5
      min: 0.4
  llm:
    model: gpt-6-luna
    allowed_models: [gpt-6-luna, gpt-5.6-luna, gpt-5-mini]
    max_spend_usd: 2.0
    max_calls: 3000
    price_per_1m_usd: {input: 0.115, output: 0.575, assumed: true}

backtest:
  seed: 20261022
  split: {train: 0.6, validation: 0.2, test: 0.2}
  episode_hours: 720                  # 30-day windows (team: do not limit the study to the 72h challenge)
  episode_start_hours_utc: [0, 360]   # two start offsets 15 days apart
  random_entry_runs: 200

shadow:
  candle_poll_delay_s: 20
  depth_poll_s: 10
  trades_poll_s: 15
  record_depth_levels: 20
  virtual_end_utc: null
